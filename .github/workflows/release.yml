name: Release

# Publish a GitHub Release, either by pushing a tag like v1.2.0, or from the Actions tab
# ("Release" > "Run workflow"), which creates the tag on the selected branch's latest commit.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 or 1.2.0-beta.1 (a suffix makes it a pre-release)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        # Tag names and inputs are untrusted text: pass them through the environment, never into the script itself.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $env:REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not a valid version (expected e.g. 1.2.0 or 1.2.0-beta.1)." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish native exe
        run: >-
          dotnet publish src/ClassBanner/ClassBanner.csproj -c Release -o publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:SourceRevisionId=${{ github.sha }}

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe publish/ClassBanner.exe

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/ClassBanner.exe dist/ClassBanner.exe
          Compress-Archive -Path policy/* -DestinationPath "dist/ClassBanner-$v-GroupPolicy.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:TAG
          $prerelease = if ($tag -match '-') { '--prerelease' } else { $null }
          # For a pushed tag the tag exists; for "Run workflow" gh creates it on the built commit.
          gh release create $tag (Get-ChildItem dist -File).FullName --title "ClassBanner $tag" --generate-notes --target $env:GITHUB_SHA $prerelease
