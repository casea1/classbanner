name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and smoke test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Publish native exe
        run: dotnet publish src/BetterBanner/BetterBanner.csproj -c Release -o publish

      - name: Download v1.0.0-beta.1 for the upgrade test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v1.0.0-beta.1 --pattern BetterBanner.exe --dir beta1

      - name: Smoke test (upgrade from beta.1, install, run, uninstall)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe publish/BetterBanner.exe -Beta1Exe beta1/BetterBanner.exe

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: BetterBanner-${{ github.sha }}
          path: |
            publish/BetterBanner.exe
            policy/
